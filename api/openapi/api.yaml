components:
  schemas:
    AlmacenDto:
      title: AlmacenDto
      type: object
      required:
      - id
      - codigo
      - nombre
      - capacidad
      - activo
      - version
      properties:
        id:
          type: string
        codigo:
          type: string
        nombre:
          type: string
        ubicacion:
          type: string
        capacidad:
          type: integer
          format: int32
        activo:
          type: boolean
        version:
          type: integer
          format: int32
    AlmacenInputDto:
      title: AlmacenInputDto
      type: object
      required:
      - codigo
      - nombre
      - capacidad
      - activo
      properties:
        codigo:
          type: string
        nombre:
          type: string
        ubicacion:
          type: string
        capacidad:
          type: integer
          format: int32
        activo:
          type: boolean
    ApiError:
      title: ApiError
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        traceId:
          type: string
    DetalleOCDto:
      title: DetalleOCDto
      type: object
      required:
      - id
      - productoId
      - cantidad
      - precioUnitario
      - subtotal
      properties:
        id:
          type: string
        productoId:
          type: string
        cantidad:
          type: integer
          format: int32
        precioUnitario:
          type: number
        subtotal:
          type: number
    DetalleOCInputDto:
      title: DetalleOCInputDto
      type: object
      required:
      - productoId
      - cantidad
      - precioUnitario
      properties:
        productoId:
          type: string
        cantidad:
          type: integer
          format: int32
        precioUnitario:
          type: number
    DetalleRecepcionDto:
      title: DetalleRecepcionDto
      type: object
      required:
      - id
      - detalleOcId
      - productoId
      - cantidadRecibida
      properties:
        id:
          type: string
        detalleOcId:
          type: string
        productoId:
          type: string
        cantidadRecibida:
          type: integer
          format: int32
    DetalleRecepcionInputDto:
      title: DetalleRecepcionInputDto
      type: object
      required:
      - detalleOcId
      - cantidadRecibida
      properties:
        detalleOcId:
          type: string
        cantidadRecibida:
          type: integer
          format: int32
    OrdenCompraDto:
      title: OrdenCompraDto
      type: object
      required:
      - id
      - folio
      - proveedorId
      - fecha
      - estado
      - total
      - version
      properties:
        id:
          type: string
        folio:
          type: string
        proveedorId:
          type: string
        fecha:
          type: string
        estado:
          type: string
        total:
          type: number
        observaciones:
          type: string
        version:
          type: integer
          format: int32
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleOCDto'
    OrdenCompraInputDto:
      title: OrdenCompraInputDto
      type: object
      required:
      - proveedorId
      properties:
        proveedorId:
          type: string
        observaciones:
          type: string
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleOCInputDto'
    PageDto_A:
      title: PageDto_A
      type: object
      required:
      - page
      - size
      - total
      - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductoDto'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ProductoDto:
      title: ProductoDto
      type: object
      required:
      - id
      - sku
      - nombre
      - categoria
      - linea
      - precio
      - puntoReorden
      - activo
      - version
      properties:
        id:
          type: string
        sku:
          type: string
        nombre:
          type: string
        categoria:
          type: string
        linea:
          type: string
        precio:
          type: number
        puntoReorden:
          type: integer
          format: int32
        proveedorPrincipalId:
          type: string
        activo:
          type: boolean
        version:
          type: integer
          format: int32
    ProductoInputDto:
      title: ProductoInputDto
      type: object
      required:
      - sku
      - nombre
      - categoria
      - linea
      - precio
      - puntoReorden
      - activo
      properties:
        sku:
          type: string
        nombre:
          type: string
        categoria:
          type: string
        linea:
          type: string
        precio:
          type: number
        puntoReorden:
          type: integer
          format: int32
        proveedorPrincipalId:
          type: string
        activo:
          type: boolean
    ProveedorDto:
      title: ProveedorDto
      type: object
      required:
      - id
      - nombre
      - activo
      - version
      properties:
        id:
          type: string
        nombre:
          type: string
        contacto:
          type: string
        email:
          type: string
        telefono:
          type: string
        condicionesPago:
          type: string
        evaluacion:
          type: integer
          format: int32
        activo:
          type: boolean
        version:
          type: integer
          format: int32
    ProveedorInputDto:
      title: ProveedorInputDto
      type: object
      required:
      - nombre
      - activo
      properties:
        nombre:
          type: string
        contacto:
          type: string
        email:
          type: string
        telefono:
          type: string
        condicionesPago:
          type: string
        evaluacion:
          type: integer
          format: int32
        activo:
          type: boolean
    RecepcionDto:
      title: RecepcionDto
      type: object
      required:
      - id
      - ordenCompraId
      - almacenId
      - fecha
      - estado
      properties:
        id:
          type: string
        ordenCompraId:
          type: string
        almacenId:
          type: string
        fecha:
          type: string
        estado:
          type: string
        observaciones:
          type: string
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleRecepcionDto'
    RecepcionInputDto:
      title: RecepcionInputDto
      type: object
      required:
      - almacenId
      properties:
        almacenId:
          type: string
        observaciones:
          type: string
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleRecepcionInputDto'
