openapi: 3.1.0
info:
  title: ERP TechSupply Solutions
  version: 0.1.0
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: ''
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/productos:
    get:
      operationId: getApiV1Productos
      parameters:
      - name: page
        in: query
        required: false
        schema:
          default: 0
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          default: 20
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDto_A'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: postApiV1Productos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInputDto'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/productos/{id}:
    get:
      operationId: getApiV1ProductosId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: deleteApiV1ProductosId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      title: ApiError
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        traceId:
          type: string
    PageDto_A:
      title: PageDto_A
      type: object
      required:
      - page
      - size
      - total
      - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductoDto'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ProductoDto:
      title: ProductoDto
      type: object
      required:
      - id
      - sku
      - nombre
      - categoria
      - linea
      - precio
      - puntoReorden
      - activo
      - version
      properties:
        id:
          type: string
        sku:
          type: string
        nombre:
          type: string
        categoria:
          type: string
        linea:
          type: string
        precio:
          type: number
        puntoReorden:
          type: integer
          format: int32
        activo:
          type: boolean
        version:
          type: integer
          format: int32
    ProductoInputDto:
      title: ProductoInputDto
      type: object
      required:
      - sku
      - nombre
      - categoria
      - linea
      - precio
      - puntoReorden
      - activo
      properties:
        sku:
          type: string
        nombre:
          type: string
        categoria:
          type: string
        linea:
          type: string
        precio:
          type: number
        puntoReorden:
          type: integer
          format: int32
        activo:
          type: boolean
