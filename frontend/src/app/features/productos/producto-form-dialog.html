<h2 mat-dialog-title>{{ producto ? 'Editar producto' : 'Nuevo producto' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>SKU</mat-label>
      <input matInput formControlName="sku" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Categoría</mat-label>
      <input matInput formControlName="categoria" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Línea</mat-label>
      <input matInput formControlName="linea" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Precio</mat-label>
      <input matInput type="number" min="0" step="0.01" formControlName="precio" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Punto de reorden</mat-label>
      <input matInput type="number" min="0" formControlName="puntoReorden" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Proveedor principal</mat-label>
      <mat-select formControlName="proveedorPrincipalId">
        <mat-option [value]="null">Sin proveedor</mat-option>
        @for (p of data.proveedores; track p.id) {
          <mat-option [value]="p.id">{{ p.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-checkbox formControlName="activo">Activo</mat-checkbox>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Guardar</button>
  </mat-dialog-actions>
</form>
