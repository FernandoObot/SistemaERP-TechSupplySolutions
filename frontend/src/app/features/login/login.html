<section class="login">
  <mat-card appearance="outlined" class="card">
    <mat-card-header>
      <mat-card-title>TechSupply Solutions</mat-card-title>
      <mat-card-subtitle>Acceso al ERP</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p class="note">
        Pantalla de demostración. En el Sprint 1 se conecta con Supabase Auth.
      </p>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Correo</mat-label>
        <input
          matInput
          type="email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          type="password"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
        />
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-flat-button color="primary" (click)="submit()">Entrar</button>
    </mat-card-actions>
  </mat-card>
</section>
