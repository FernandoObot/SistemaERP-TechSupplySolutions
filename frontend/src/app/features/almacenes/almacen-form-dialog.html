<h2 mat-dialog-title>{{ data ? 'Editar almacén' : 'Nuevo almacén' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Código</mat-label>
      <input matInput formControlName="codigo" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Ubicación</mat-label>
      <input matInput formControlName="ubicacion" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Capacidad</mat-label>
      <input matInput type="number" min="0" formControlName="capacidad" />
    </mat-form-field>

    <mat-checkbox formControlName="activo">Activo</mat-checkbox>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Guardar</button>
  </mat-dialog-actions>
</form>
